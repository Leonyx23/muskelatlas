<head>

<style>
:root{--bg:#ECEFEA;--surface:#F8F9F6;--ink:#18211D;--muted:#5A6760;--line:#D3D9D2;--field:#fff;--accent:#2F5D50;--on-accent:#fff;--err:#B33A2E}
@media (prefers-color-scheme: dark){:root{--bg:#121714;--surface:#1A211D;--ink:#E4EAE6;--muted:#98A59D;--line:#2C3631;--field:#121714;--accent:#7DB8A0;--on-accent:#0E1512;--err:#F0897C}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{width:100%;max-width:380px;text-align:center}
.logo{width:84px;height:84px;border-radius:19px;display:block;margin:0 auto 18px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
h1{font:800 32px/1.1 "Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;margin:0 0 6px;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--muted)}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:12px}
.lbl{font-weight:600;font-size:14px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
.eye{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.keep{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);cursor:pointer}
.keep input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.go{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;cursor:pointer}
.go[disabled]{opacity:.6;cursor:progress}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:1.45em;margin:0;font-size:15px;color:var(--err)}
.msg.info{color:var(--muted)}
.msg:empty{display:none}
.wait{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <img class="logo" src="icon-180.png" alt="">
  <h1>Taktik-Treppe</h1>
  <p class="sub">Geschützter Zugang</p>
  <form id="f" hidden>
    <label class="lbl" for="pw">Passwort</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button class="eye" type="button" id="eye" aria-pressed="false" aria-controls="pw">Zeigen</button>
    </div>
    <label class="keep"><input type="checkbox" id="keep" checked> Auf diesem Gerät angemeldet bleiben</label>
    <button class="go" id="go" type="submit">Öffnen</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="wait" id="wait" role="status">Wird geöffnet …</p>
</main>

<script>
/* Entschlüsselt die App erst nach dem richtigen Passwort (AES-GCM, Schlüssel per PBKDF2).
   Alles bleibt in einer Funktion, damit keine Namen mit der App kollidieren. */
(function () {
  var STORE = 'taktik-treppe.zugang';
  var P = JSON.parse(document.getElementById('payload').textContent);
  function $(id) { return document.getElementById(id); }
  function fromB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(u) { var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  function get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }
  function del() { try { localStorage.removeItem(STORE); } catch (e) {} }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  var form = $('f'), pw = $('pw'), msg = $('msg'), go = $('go'), wait = $('wait');
  if (!window.crypto || !crypto.subtle || !window.TextDecoder) {
    wait.textContent = 'Dieser Browser kann den geschützten Zugang nicht öffnen. Bitte die Adresse (https://…) in Safari, Chrome oder Edge öffnen.';
    return;
  }

  function derive(pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: fromB64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256);
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function unlock(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(P.iv) }, key, fromB64(P.data)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function ask() { wait.hidden = true; form.hidden = false; pw.focus(); }

  $('eye').onclick = function () {
    var reveal = pw.type === 'password';
    pw.type = reveal ? 'text' : 'password';
    this.textContent = reveal ? 'Verbergen' : 'Zeigen';
    this.setAttribute('aria-pressed', String(reveal));
  };

  form.onsubmit = function (e) {
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; msg.className = 'msg info'; msg.textContent = 'Wird geöffnet …';
    var raw;
    derive(pw.value)
      .then(function (r) { raw = r; return unlock(r); })
      .then(function (html) { if ($('keep').checked) set(toB64(raw)); else del(); show(html); })
      .catch(function () {
        go.disabled = false; msg.className = 'msg'; msg.textContent = 'Das Passwort stimmt nicht.';
        pw.select();
      });
  };

  var saved = get();
  if (saved) {
    unlock(fromB64(saved)).then(show).catch(function () { del(); ask(); });
  } else {
    ask();
  }
})();
</script>
